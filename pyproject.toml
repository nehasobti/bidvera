[project]
name = "bidvera"
version = "0.1.0"
description = "Bidvera: Multi-agent proposal response & RFP automation platform"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "pydantic>=2.7.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.9",
    "pyyaml>=6.0.1",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E402", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["mcp-servers", "tests"]
asyncio_mode = "strict"

[project]
name = "bidvera-mcp-company-knowledge"
version = "0.1.0"
description = "Bidvera MCP Server for Tychon Software corporate knowledge, case studies, certifications, CVs, and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "pydantic>=2.7.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
